[package]
name = "steamdirstats"
version = "1.0.0"
description = "Disk space used by installed Steam games"
authors = ["fabd"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The desktop binary is a thin wrapper around this; keeping the logic in a lib
# is what lets `cargo test` reach it.
name = "steamdirstats_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# Capitalized so the portable exe ships as SteamDirStats.exe.
name = "SteamDirStats"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
